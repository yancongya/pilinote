[tool:pytest]
# Test discovery - configure test discovery paths and patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support - enable automatic async test mode
asyncio_mode = auto

# Coverage configuration - as specified in task requirements
addopts = 
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --strict-markers
    --strict-config
    --verbose
    --tb=short

# Test markers for categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    performance: Performance and load tests
    slow: Slow running tests (>5 seconds)
    asyncio: Async tests requiring event loop
    database: Tests requiring database connection
    websocket: Tests involving WebSocket communication
    api: API endpoint tests
    mock: Tests using mocked dependencies

# Minimum pytest version
minversion = 7.0

# Test timeout (in seconds) - prevent hanging tests
timeout = 300

# Parallel execution configuration
# Uncomment to enable parallel test execution with pytest-xdist
# addopts = -n auto

# Warning filters - suppress known warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning

# Test collection configuration
collect_ignore = 
    setup.py
    conftest.py
    venv
    __pycache__
    .pytest_cache

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test environment configuration
env = 
    TESTING = true
    LOG_LEVEL = DEBUG
    DATABASE_URL = sqlite+aiosqlite:///:memory:
    MAX_CONCURRENT_DOWNLOADS = 3
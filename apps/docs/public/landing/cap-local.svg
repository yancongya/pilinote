<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 156" role="img" aria-label="local knowledge graph demo">
  <style>
    .grid{stroke:#e6edf5;stroke-width:1}.node{fill:#fff;stroke:#16b8ee;stroke-width:3;animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.node:nth-of-type(2){animation-delay:.25s}.node:nth-of-type(3){animation-delay:.5s}.node:nth-of-type(4){animation-delay:.75s}.link{stroke:#ff78ad;stroke-width:3;fill:none;stroke-dasharray:12 10;animation:dash 3s linear infinite}.disk{fill:#fff;stroke:#dbe3ee}.txt{font:700 10px ui-monospace,Menlo,monospace;fill:#7b8794}@keyframes dash{to{stroke-dashoffset:-88}}@keyframes pulse{50%{transform:scale(1.08);filter:drop-shadow(0 8px 14px rgba(22,184,238,.2))}}
  </style>
  <path class="grid" d="M0 30H420M0 60H420M0 90H420M0 120H420M70 0V156M140 0V156M210 0V156M280 0V156M350 0V156"/>
  <rect class="disk" x="154" y="50" width="112" height="64" rx="20"/><text class="txt" x="176" y="85">LOCAL DB</text>
  <path class="link" d="M210 50V34M154 82H76M266 82H344M210 114V130"/>
  <circle class="node" cx="210" cy="34" r="10"/><circle class="node" cx="76" cy="82" r="10"/><circle class="node" cx="344" cy="82" r="10"/><circle class="node" cx="210" cy="130" r="10"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2bd9ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="80" width="1360" height="740" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="120" y="80" width="1360" height="52" rx="28" fill="#0f1320" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="158" cy="106" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="182" cy="106" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="206" cy="106" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <text x="240" y="112" font-size="14" fill="#ffffff" fill-opacity="0.65" font-family="ui-sans-serif, system-ui">PiliNote · 视频详情</text>

    <!-- player -->
    <rect x="160" y="160" width="820" height="460" rx="22" fill="#000" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="190" y="190" width="760" height="340" rx="18" fill="#000" fill-opacity="0.34" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="190" y="548" width="760" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="190" y="548" width="260" height="10" rx="5" fill="url(#accent)" opacity="0.65"/>
    <circle cx="450" cy="553" r="8" fill="#4f8cff" fill-opacity="0.85"/>

    <!-- right panel: AI note -->
    <rect x="1010" y="160" width="430" height="660" rx="22" fill="#000" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="1040" y="190" width="170" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="1040" y="214" width="260" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>

    <!-- timeline rail -->
    <rect x="1040" y="250" width="370" height="8" rx="4" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="1040" y="250" width="150" height="8" rx="4" fill="url(#accent)" opacity="0.6"/>

    <!-- timestamp chips -->
    <g>
      <rect x="1040" y="278" width="84" height="28" rx="14" fill="#4f8cff" fill-opacity="0.18" stroke="#4f8cff" stroke-opacity="0.22"/>
      <text x="1082" y="297" font-size="12" fill="#ffffff" fill-opacity="0.86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco">00:07</text>

      <rect x="1132" y="278" width="84" height="28" rx="14" fill="#2bd9ff" fill-opacity="0.10" stroke="#2bd9ff" stroke-opacity="0.18"/>
      <text x="1174" y="297" font-size="12" fill="#ffffff" fill-opacity="0.80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco">01:21</text>

      <rect x="1224" y="278" width="84" height="28" rx="14" fill="#4f8cff" fill-opacity="0.18" stroke="#4f8cff" stroke-opacity="0.22"/>
      <text x="1266" y="297" font-size="12" fill="#ffffff" fill-opacity="0.86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco">03:50</text>

      <rect x="1316" y="278" width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="1358" y="297" font-size="12" fill="#ffffff" fill-opacity="0.70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco">05:29</text>
    </g>

    <!-- note blocks -->
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="1040" y="330" width="330" height="10" rx="5"/>
      <rect x="1040" y="350" width="280" height="10" rx="5"/>
      <rect x="1040" y="384" width="360" height="10" rx="5"/>
      <rect x="1040" y="404" width="300" height="10" rx="5"/>
      <rect x="1040" y="438" width="210" height="10" rx="5"/>
    </g>

    <!-- seek hint -->
    <rect x="1040" y="490" width="370" height="110" rx="18" fill="#4f8cff" fill-opacity="0.10" stroke="#4f8cff" stroke-opacity="0.16"/>
    <text x="1062" y="520" font-size="12" fill="#ffffff" fill-opacity="0.78" font-family="ui-sans-serif, system-ui">点击时间戳可回跳播放进度（示意）</text>
    <rect x="1060" y="546" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="1060" y="566" width="260" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="1060" y="586" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>

    <!-- bottom meta -->
    <rect x="160" y="640" width="820" height="180" rx="22" fill="#000" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="190" y="670" width="320" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="190" y="694" width="520" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="190" y="716" width="460" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="190" y="738" width="380" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <rect x="0" y="0" width="1600" height="6" fill="url(#accent)" opacity="0.75"/>
</svg>


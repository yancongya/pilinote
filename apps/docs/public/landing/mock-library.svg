<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2bd9ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="140" y="90" width="1320" height="720" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="140" y="90" width="1320" height="52" rx="28" fill="#0f1320" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="178" cy="116" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="202" cy="116" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <circle cx="226" cy="116" r="7" fill="#ffffff" fill-opacity="0.20"/>
    <text x="260" y="122" font-size="14" fill="#ffffff" fill-opacity="0.65" font-family="ui-sans-serif, system-ui">PiliNote · 媒体库</text>

    <!-- sidebar -->
    <rect x="140" y="142" width="220" height="668" fill="#0b0e14" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.06"/>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="168" y="180" width="164" height="14" rx="7"/>
      <rect x="168" y="218" width="140" height="14" rx="7"/>
      <rect x="168" y="256" width="152" height="14" rx="7"/>
      <rect x="168" y="294" width="126" height="14" rx="7"/>
      <rect x="168" y="332" width="148" height="14" rx="7"/>
      <rect x="168" y="370" width="110" height="14" rx="7"/>
    </g>
    <rect x="160" y="172" width="180" height="30" rx="12" fill="#4f8cff" fill-opacity="0.14" stroke="#4f8cff" stroke-opacity="0.20"/>

    <!-- topbar -->
    <g>
      <rect x="390" y="170" width="760" height="42" rx="14" fill="#000" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="412" y="186" width="260" height="10" rx="5" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="1180" y="170" width="120" height="42" rx="14" fill="#4f8cff" fill-opacity="0.16" stroke="#4f8cff" stroke-opacity="0.24"/>
      <rect x="1204" y="186" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
    </g>

    <!-- grid -->
    <g>
      <rect x="390" y="238" width="1070" height="572" rx="22" fill="#000" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.06"/>
      <g transform="translate(420 270)">
        <!-- tiles 3x2 -->
        <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08">
          <rect x="0" y="0" width="320" height="196" rx="18"/>
          <rect x="344" y="0" width="320" height="196" rx="18"/>
          <rect x="688" y="0" width="320" height="196" rx="18"/>
          <rect x="0" y="220" width="320" height="196" rx="18"/>
          <rect x="344" y="220" width="320" height="196" rx="18"/>
          <rect x="688" y="220" width="320" height="196" rx="18"/>
        </g>
        <!-- thumbnails -->
        <g fill="#000" fill-opacity="0.22">
          <rect x="18" y="18" width="284" height="120" rx="14"/>
          <rect x="362" y="18" width="284" height="120" rx="14"/>
          <rect x="706" y="18" width="284" height="120" rx="14"/>
          <rect x="18" y="238" width="284" height="120" rx="14"/>
          <rect x="362" y="238" width="284" height="120" rx="14"/>
          <rect x="706" y="238" width="284" height="120" rx="14"/>
        </g>
        <!-- text lines -->
        <g fill="#ffffff" fill-opacity="0.12">
          <rect x="18" y="150" width="170" height="10" rx="5"/>
          <rect x="18" y="170" width="120" height="10" rx="5"/>
          <rect x="362" y="150" width="210" height="10" rx="5"/>
          <rect x="362" y="170" width="140" height="10" rx="5"/>
          <rect x="706" y="150" width="190" height="10" rx="5"/>
          <rect x="706" y="170" width="120" height="10" rx="5"/>
          <rect x="18" y="370" width="200" height="10" rx="5"/>
          <rect x="18" y="390" width="130" height="10" rx="5"/>
          <rect x="362" y="370" width="180" height="10" rx="5"/>
          <rect x="362" y="390" width="120" height="10" rx="5"/>
          <rect x="706" y="370" width="220" height="10" rx="5"/>
          <rect x="706" y="390" width="140" height="10" rx="5"/>
        </g>
        <!-- status chips -->
        <g>
          <rect x="216" y="156" width="70" height="18" rx="9" fill="#4f8cff" fill-opacity="0.18" stroke="#4f8cff" stroke-opacity="0.22"/>
          <rect x="560" y="156" width="70" height="18" rx="9" fill="#2bd9ff" fill-opacity="0.10" stroke="#2bd9ff" stroke-opacity="0.18"/>
          <rect x="904" y="156" width="70" height="18" rx="9" fill="#4f8cff" fill-opacity="0.18" stroke="#4f8cff" stroke-opacity="0.22"/>
        </g>
      </g>
    </g>
  </g>

  <!-- subtle brand bar -->
  <rect x="0" y="0" width="1600" height="6" fill="url(#accent)" opacity="0.75"/>
</svg>


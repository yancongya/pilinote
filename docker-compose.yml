services:
  pilinote:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - pilinote_data:/data
    environment:
      - PILINOTE_RUNTIME_DIR=/data
      - DATABASE_URL=sqlite:////data/data/pilinote.db
      - SECRET_KEY=${SECRET_KEY:-pilinote-secret-key}
    restart: unless-stopped

volumes:
  pilinote_data:

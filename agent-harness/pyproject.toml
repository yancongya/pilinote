[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilinote-cli"
version = "0.1.0"
description = "PiliNote 原生 API 的独立命令行入口"
requires-python = ">=3.11"

[project.scripts]
pilinote = "pilinote_cli.cli:main"

[tool.setuptools.packages.find]
include = ["pilinote_cli*"]
